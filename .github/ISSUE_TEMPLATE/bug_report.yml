name: Bug report
description: Something in HookRelay doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security problems:** please use private reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps, ideally curl commands against a fresh `docker compose up -d`.
      placeholder: |
        1. docker compose up -d
        2. curl -X POST localhost:8080/in/demo -H 'Content-Type: application/json' -d '{...}'
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: For example `docker compose logs worker --no-log-prefix | jq 'select(.extra.event_id=="…")'`. Remove secrets first.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v0.2.0 or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Ingestion, Delivery / retries, Dashboard, Management API, Deployment / Docker, Other]
