name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (audit, Pint, Pest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hookrelay_test
          POSTGRES_USER: hookrelay
          POSTGRES_PASSWORD: hookrelay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hookrelay -d hookrelay_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: hookrelay
      DB_PASSWORD: hookrelay
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, pgsql, redis, pcntl, bcmath, intl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('api/composer.lock') }}

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Composer audit
        run: composer audit --no-interaction

      - name: Pint
        run: vendor/bin/pint --test

      - name: Pest
        run: php artisan test

  dashboard:
    name: Dashboard (audit, ESLint, types, tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: npm audit (fail on high or critical)
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    name: Docker images build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker compose build
